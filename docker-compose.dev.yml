# kGPT Development Docker Compose
#
# This file runs ONLY infrastructure (Qdrant, Kafka) while you run
# the backend and frontend locally with hot-reload for fast iteration.
#
# Usage:
#   make dev-infra      # Start infrastructure only
#   make dev            # Start everything (infra + backend + frontend)
#
# Or manually:
#   docker compose -f docker-compose.dev.yml up -d
#   uvicorn kgpt.api.main:app --reload --port 8000
#   cd frontend && npm run dev

services:
  # Vector database - required
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ===========================================
  # Optional: Demo Kafka Cluster (3-Broker)
  # Start with: docker compose -f docker-compose.dev.yml --profile kafka up
  # ===========================================

  kafka-1:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka-1
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_dev_data_1:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-2:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka-2
    ports:
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_dev_data_2:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-3:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka-3
    ports:
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_dev_data_3:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Creates demo topics with replication
  kafka-setup:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "🚀 Setting up demo Kafka topics..."
        BOOTSTRAP="kafka-1:9092,kafka-2:9092,kafka-3:9092"
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic orders --partitions 12 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic payments --partitions 6 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic users --partitions 6 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic inventory --partitions 6 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic notifications --partitions 3 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic audit-logs --partitions 3 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic click-events --partitions 12 --replication-factor 3
        echo "✅ Demo topics created!"
        kafka-topics --bootstrap-server $$BOOTSTRAP --list
    restart: "no"

  # Continuous producer for dev
  kafka-producer:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "🏭 Starting continuous producer..."
        BOOTSTRAP="kafka-1:9092,kafka-2:9092,kafka-3:9092"
        ORDER_ID=1000
        while true; do
          ORDER_ID=$$((ORDER_ID + 1))
          TIMESTAMP=$$(date -Iseconds)
          echo "{\"order_id\": \"ORD-$$ORDER_ID\", \"user_id\": \"user-$$((RANDOM % 500))\", \"amount\": $$((RANDOM % 1000)).$$((RANDOM % 100)), \"timestamp\": \"$$TIMESTAMP\"}" | \
            kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic orders 2>/dev/null
          echo "{\"payment_id\": \"PAY-$$ORDER_ID\", \"amount\": $$((RANDOM % 500)).$$((RANDOM % 100)), \"status\": \"success\", \"timestamp\": \"$$TIMESTAMP\"}" | \
            kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic payments 2>/dev/null
          for i in 1 2 3; do
            echo "{\"user_id\": \"user-$$((RANDOM % 500))\", \"page\": \"/product/$$((RANDOM % 100))\", \"timestamp\": \"$$TIMESTAMP\"}" | \
              kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic click-events 2>/dev/null
          done
          sleep 1
        done
    restart: unless-stopped

  # Consumer groups for dev
  kafka-consumer-orders:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "📦 Starting order-processor..."
        kafka-console-consumer --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --topic orders --group order-processor --from-beginning
    restart: unless-stopped

  kafka-consumer-payments:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "💳 Starting payment-service..."
        kafka-console-consumer --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --topic payments --group payment-service --from-beginning
    restart: unless-stopped

  kafka-consumer-analytics:
    profiles: ["kafka"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "📊 Starting analytics-pipeline..."
        kafka-console-consumer --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 \
          --topic click-events --group analytics-pipeline --from-beginning
    restart: unless-stopped

volumes:
  qdrant_dev_data:
  kafka_dev_data_1:
  kafka_dev_data_2:
  kafka_dev_data_3:
