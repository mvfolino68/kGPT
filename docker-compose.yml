  # Topic setup - creates demo topics with replication
  kafka-demo-setup:
    profiles: ["demo"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "🚀 Setting up demo Kafka topics on 3-broker cluster..."

        BOOTSTRAP="kafka-1:9092,kafka-2:9092,kafka-3:9092"

        # Create demo topics with replication factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic orders --partitions 12 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic payments --partitions 6 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic users --partitions 6 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic inventory --partitions 6 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic notifications --partitions 3 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic audit-logs --partitions 3 --replication-factor 3
        kafka-topics --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic click-events --partitions 12 --replication-factor 3

        echo ""
        echo "✅ Demo topics created!"
        kafka-topics --bootstrap-server $$BOOTSTRAP --list
        echo ""
        echo "📊 Topic details:"
        kafka-topics --bootstrap-server $$BOOTSTRAP --describe
        echo ""
        echo "🎉 Kafka demo cluster is ready!"
        echo "   Connect via: localhost:9094 (broker-1), localhost:9095 (broker-2), localhost:9096 (broker-3)"
    restart: "no"

  # Continuous producer - generates realistic demo data
  kafka-demo-producer:
    profiles: ["demo"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka-demo-setup:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "🏭 Starting continuous demo producer..."

        BOOTSTRAP="kafka-1:9092,kafka-2:9092,kafka-3:9092"

        # Product catalog for realistic data
        PRODUCTS=("Laptop" "Phone" "Tablet" "Headphones" "Monitor" "Keyboard" "Mouse" "Camera" "Speaker" "Watch")
        STATUSES=("pending" "processing" "shipped" "delivered" "cancelled")
        ACTIONS=("login" "logout" "view_product" "add_to_cart" "checkout" "search")
        WAREHOUSES=("NYC-01" "LAX-02" "CHI-03" "DAL-04" "SEA-05")
        NOTIFICATION_TYPES=("order_confirmation" "shipping_update" "promotion" "account_alert" "password_reset")

        ORDER_ID=1000
        PAYMENT_ID=5000
        USER_SEQ=1

        while true; do
          TIMESTAMP=$$(date -Iseconds)

          # Orders (~2/sec) - E-commerce order events
          for i in 1 2; do
            ORDER_ID=$$((ORDER_ID + 1))
            USER_ID=$$((RANDOM % 500 + 1))
            PRODUCT=$${PRODUCTS[$$((RANDOM % 10))]}
            AMOUNT=$$(awk "BEGIN {printf \"%.2f\", ($$RANDOM % 99900 + 100) / 100}")
            STATUS=$${STATUSES[$$((RANDOM % 5))]}
            QTY=$$((RANDOM % 5 + 1))
            echo "{\"order_id\": \"ORD-$$ORDER_ID\", \"user_id\": \"user-$$USER_ID\", \"product\": \"$$PRODUCT\", \"quantity\": $$QTY, \"amount\": $$AMOUNT, \"status\": \"$$STATUS\", \"timestamp\": \"$$TIMESTAMP\"}" | \
              kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic orders 2>/dev/null
          done

          # Payments (~1/sec) - Financial transactions
          PAYMENT_ID=$$((PAYMENT_ID + 1))
          ORDER_REF=$$((ORDER_ID - RANDOM % 50))
          AMOUNT=$$(awk "BEGIN {printf \"%.2f\", ($$RANDOM % 99900 + 100) / 100}")
          PAY_STATUS=$$([ $$((RANDOM % 10)) -lt 8 ] && echo "success" || echo "failed")
          PAY_METHOD=$$([ $$((RANDOM % 2)) -eq 0 ] && echo "credit_card" || echo "paypal")
          echo "{\"payment_id\": \"PAY-$$PAYMENT_ID\", \"order_id\": \"ORD-$$ORDER_REF\", \"amount\": $$AMOUNT, \"status\": \"$$PAY_STATUS\", \"method\": \"$$PAY_METHOD\", \"timestamp\": \"$$TIMESTAMP\"}" | \
            kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic payments 2>/dev/null

          # Users (~0.5/sec, every other iteration)
          if [ $$((USER_SEQ % 2)) -eq 0 ]; then
            USER_ID=$$((RANDOM % 500 + 1))
            ACTION=$${ACTIONS[$$((RANDOM % 6))]}
            SESSION="sess-$$((RANDOM % 10000))"
            echo "{\"user_id\": \"user-$$USER_ID\", \"action\": \"$$ACTION\", \"session_id\": \"$$SESSION\", \"ip\": \"192.168.$$((RANDOM % 255)).$$((RANDOM % 255))\", \"timestamp\": \"$$TIMESTAMP\"}" | \
              kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic users 2>/dev/null
          fi

          # Inventory (~1/sec) - Stock level changes
          PRODUCT=$${PRODUCTS[$$((RANDOM % 10))]}
          SKU="SKU-$$((RANDOM % 1000 + 1000))"
          WAREHOUSE=$${WAREHOUSES[$$((RANDOM % 5))]}
          DELTA=$$([ $$((RANDOM % 3)) -eq 0 ] && echo "-$$((RANDOM % 10 + 1))" || echo "+$$((RANDOM % 50 + 1))")
          STOCK=$$((RANDOM % 500 + 10))
          echo "{\"sku\": \"$$SKU\", \"product\": \"$$PRODUCT\", \"warehouse\": \"$$WAREHOUSE\", \"delta\": \"$$DELTA\", \"current_stock\": $$STOCK, \"timestamp\": \"$$TIMESTAMP\"}" | \
            kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic inventory 2>/dev/null

          # Notifications (~0.3/sec, every 3rd iteration)
          if [ $$((USER_SEQ % 3)) -eq 0 ]; then
            USER_ID=$$((RANDOM % 500 + 1))
            NOTIF_TYPE=$${NOTIFICATION_TYPES[$$((RANDOM % 5))]}
            CHANNEL=$$([ $$((RANDOM % 2)) -eq 0 ] && echo "email" || echo "push")
            echo "{\"user_id\": \"user-$$USER_ID\", \"type\": \"$$NOTIF_TYPE\", \"channel\": \"$$CHANNEL\", \"sent\": true, \"timestamp\": \"$$TIMESTAMP\"}" | \
              kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic notifications 2>/dev/null
          fi

          # Audit logs (~0.5/sec)
          if [ $$((USER_SEQ % 2)) -eq 0 ]; then
            SERVICES=("order-service" "payment-service" "user-service" "inventory-service" "notification-service")
            SERVICE=$${SERVICES[$$((RANDOM % 5))]}
            OPERATIONS=("CREATE" "UPDATE" "DELETE" "READ")
            OPERATION=$${OPERATIONS[$$((RANDOM % 4))]}
            echo "{\"service\": \"$$SERVICE\", \"operation\": \"$$OPERATION\", \"entity_id\": \"$$((RANDOM % 10000))\", \"user\": \"admin-$$((RANDOM % 10 + 1))\", \"timestamp\": \"$$TIMESTAMP\"}" | \
              kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic audit-logs 2>/dev/null
          fi

          # Click events (~5/sec) - Analytics stream
          for i in 1 2 3 4 5; do
            USER_ID=$$((RANDOM % 500 + 1))
            PAGES=("/home" "/products" "/cart" "/checkout" "/account" "/search" "/product/$$((RANDOM % 100))")
            PAGE=$${PAGES[$$((RANDOM % 7))]}
            ELEMENTS=("button" "link" "image" "nav" "card" "form")
            ELEMENT=$${ELEMENTS[$$((RANDOM % 6))]}
            echo "{\"user_id\": \"user-$$USER_ID\", \"page\": \"$$PAGE\", \"element\": \"$$ELEMENT\", \"x\": $$((RANDOM % 1920)), \"y\": $$((RANDOM % 1080)), \"timestamp\": \"$$TIMESTAMP\"}" | \
              kafka-console-producer --bootstrap-server $$BOOTSTRAP --topic click-events 2>/dev/null
          done

          USER_SEQ=$$((USER_SEQ + 1))
          sleep 1
        done
    restart: unless-stopped

  # Consumer Group: Order Processor (3 instances simulating scaled service)
  kafka-consumer-orders-1:
    profiles: ["demo"]
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
