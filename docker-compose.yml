# kGPT Docker Compose Configuration
#
# Quick Start:
#   docker compose up                              # Core services (frontend + backend + Qdrant)
#   docker compose --profile ollama up             # + Local LLM (Ollama)
#   docker compose --profile demo up               # + Demo Kafka cluster
#   docker compose --profile ollama --profile demo up  # Everything
#
# Access:
#   Frontend: http://localhost:3000
#   API Docs: http://localhost:8000/docs

services:
  # ===========================================
  # CORE SERVICES (always started)
  # ===========================================

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=openai
      - EMBEDDING_PROVIDER=fastembed
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - kgpt_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================
  # OPTIONAL: Local LLM (Ollama)
  # Start with: docker compose --profile ollama up
  # ===========================================

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "ollama serve & sleep 10 && ollama pull llama3.2 && wait",
      ]
    restart: unless-stopped

  # ===========================================
  # OPTIONAL: Demo Kafka Cluster (3-Broker)
  # Start with: docker compose --profile demo up
  #
  # Features:
  #   - 3-broker KRaft cluster (no ZooKeeper)
  #   - Continuous data production
  #   - Multiple consumer groups simulating microservices
  #   - External ports: 9094, 9095, 9096
  # ===========================================

  kafka-1:
    profiles: ["demo"]
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka-1
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

