<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Premium gradient inspired by Linear's violet aesthetic -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle rounded square -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bgGradient)"/>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="url(#accentGradient)" stroke-width="0.5" opacity="0.5"/>

  <!-- Stylized K with premium stroke -->
  <path d="M9 7v18" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M9 16l9-9" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 16l9 9" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI streaming dots with glow effect -->
  <circle cx="24" cy="10" r="2.5" fill="url(#glowGradient)"/>
  <circle cx="24" cy="10" r="1.5" fill="#c4b5fd"/>

  <circle cx="24" cy="16" r="2" fill="url(#glowGradient)" opacity="0.7"/>
  <circle cx="24" cy="16" r="1.2" fill="#a78bfa"/>

  <circle cx="24" cy="22" r="1.5" fill="url(#glowGradient)" opacity="0.4"/>
  <circle cx="24" cy="22" r="0.9" fill="#8b5cf6"/>
</svg>
